name: Qwen 0.6B reference checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: CPU reference / ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [embedding, reranker]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      MODEL_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir -e '.[hf]' pytest
      - name: Resolve immutable checkpoint and download only inference files
        run: python validation/prepare_reference.py
      - name: Reference comparison
        run: python -m pytest -q tests/test_real_model.py -m slow --junitxml=reference-junit.xml
      - name: Require the intended reference test to pass without skipping
        if: ${{ !cancelled() }}
        run: python validation/check_reference_result.py reference-junit.xml
      - run: python -m pip freeze > reference-requirements.txt
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reference-${{ matrix.kind }}
          path: |
            reference-junit.xml
            reference-model.json
            reference-verification.json
            reference-requirements.txt
          retention-days: 7

  training:
    name: CPU bounded LoRA training and reload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir -e '.[train]'
      - run: timeout 1200s python -u validation/real_training_smoke.py --threads 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: real-training
          path: validation-results/**/result.json
          retention-days: 7
