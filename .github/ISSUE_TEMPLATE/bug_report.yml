name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the full error / traceback.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code or CLI command. Prefer `HashingEncoder` or a small public model if possible.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `clmkit info` (clmkit, python, backends, device)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: e.g. Qwen/Qwen3-Embedding-8B (revision if pinned)
